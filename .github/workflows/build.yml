# 云编译 OpenStick (MSM8916 随身 WiFi) 的 Debian 镜像
#
# 用法：
#   1. Fork 本仓库（或直接使用本仓库），进入 Actions 页面
#   2. 选择 "Build OpenStick Debian Image" -> Run workflow
#   3. 选择 Debian 版本、板型，运行结束后在本次运行的 Artifacts 中下载
#
# 构建流程与这篇教程一致：
#   https://fire0594.com/tech/debian-13-trixie-on-msm8916-wifi-dongle-by-openstick-builder/
#
# 注意：
#   - Debian 13 (Trixie) 的 libconfig 运行时包名是 libconfig11，
#     工作流会在 debootstrap 前自动修改 scripts/setup.sh（对应教程 1.1 节）
#   - 选择 bookworm 时保持 libconfig9 不变
#   - 内核默认使用 pmOS v26.06 / 6.12.1-r5，可在 Run workflow 时选择分支和版本
#   - 默认使用 ubuntu-24.04-arm 原生 arm64 runner（debootstrap 无需 QEMU 模拟，
#     整个流程约 10 分钟）；公共仓库免费。私有仓库或需要 x86_64 时可选择
#     ubuntu-24.04，此时走 QEMU 模拟，rootfs 会自动缓存以便下次复用
#   - 产物在 files/ 目录：gpt_both0.bin / aboot.mbn / hyp.mbn / rpm.mbn /
#     sbl1.mbn / tz.mbn / boot.bin / rootfs.bin / SHA256SUMS

name: Build OpenStick Debian Image

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Debian release (trixie = Debian 13)'
        required: true
        default: trixie
        type: choice
        options:
          - trixie
          - bookworm
      board:
        description: 'Board / devicetree written to extlinux.conf'
        required: true
        default: yiming-uz801v3
        type: choice
        options:
          - yiming-uz801v3
          - thwc-uf896
          - thwc-ufi001c
          - jz01-45-v33
          - fy-mf800
      hostname:
        description: 'Hostname of the generated image'
        required: false
        default: openstick-debian
        type: string
      kernel_branch:
        description: 'pmOS branch for the kernel package'
        required: true
        default: v26.06
        type: choice
        options:
          - v26.06
          - v25.12
          - v24.06
      kernel_version:
        description: 'Kernel package version (v26.06: 6.12.1-r5, v25.12: 6.12.1-r2, v24.06: 6.6-r5)'
        required: true
        default: 6.12.1-r5
        type: string
      runner:
        description: 'Runner label (arm64 = native build, ~10x faster; ubuntu-24.04 = QEMU emulation)'
        required: true
        default: ubuntu-24.04-arm
        type: choice
        options:
          - ubuntu-24.04-arm
          - ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Debian ${{ inputs.release }} / ${{ inputs.board }} / ${{ inputs.kernel_version }}
    # Native aarch64 runner: debootstrap and every maintainer script run at full
    # speed instead of through qemu-user. Public repositories get these runners
    # for free; private forks can fall back to ubuntu-24.04 (emulated, slower).
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 180
    env:
      RELEASE: ${{ inputs.release || 'trixie' }}
      HOST_NAME: ${{ inputs.hostname || 'openstick-debian' }}
      BOARD: ${{ inputs.board || 'yiming-uz801v3' }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch || 'v26.06' }}
      KERNEL_VERSION: ${{ inputs.kernel_version || '6.12.1-r5' }}
      KERNEL_URL: https://mirror.postmarketos.org/postmarketos/${{ inputs.kernel_branch || 'v26.06' }}/aarch64/linux-postmarketos-qcom-msm8916-${{ inputs.kernel_version || '6.12.1-r5' }}.apk
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free up disk space
        run: |
          # runner 开机时可能正在跑 unattended-upgrades，会占住 apt 锁
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Validate kernel package
        run: |
          echo "Kernel: ${KERNEL_BRANCH} / ${KERNEL_VERSION}"
          echo "URL: ${KERNEL_URL}"
          # 提前确认包存在，避免构建半小时后才发现 404
          curl -fsL --retry 3 --retry-delay 5 --max-time 60 \
            -r 0-0 -o /dev/null -w 'HTTP %{http_code}\n' "${KERNEL_URL}"

      - name: Install build dependencies
        run: |
          retry() {
            local attempts=$1; shift
            for i in $(seq 1 "$attempts"); do
              "$@" && return 0
              echo "::warning::'$*' failed (attempt $i/$attempts), retrying in 15s"
              sleep 15
            done
            return 1
          }
          retry 3 sudo sh -e scripts/install_deps.sh

      - name: Apply Debian 13 fix (libconfig11)
        if: inputs.release == 'trixie'
        run: |
          # 教程 1.1 节：Debian 13 的 libconfig 包由 libconfig9 变为 libconfig11
          sed -i 's/libconfig9/libconfig11/g' scripts/setup.sh
          grep -n 'libconfig' scripts/setup.sh

      - name: Select board devicetree
        if: inputs.board != 'yiming-uz801v3'
        run: |
          # 教程 4.2 节：默认板型是 UZ801，其它板型需要替换 extlinux.conf 中的 dtb 名称。
          # 在 debootstrap 之前改，生成的 boot 分区里就是正确的 dtb。
          sed -i "s/yiming-uz801v3/$BOARD/g" configs/extlinux.conf
          cat configs/extlinux.conf

      - name: Build hyp and lk2nd (aboot)
        run: sudo sh -e scripts/build_hyp_aboot.sh

      - name: Extract Qualcomm firmware and create GPT
        run: |
          retry() {
            local attempts=$1; shift
            for i in $(seq 1 "$attempts"); do
              "$@" && return 0
              echo "::warning::'$*' failed (attempt $i/$attempts), retrying in 15s"
              sleep 15
            done
            return 1
          }
          retry 3 sudo sh -e scripts/extract_fw.sh

      - name: Compute rootfs cache key
        id: rootfs-key
        run: |
          # Everything that ends up inside rootfs.tgz must be part of the key.
          # Computed once so that restore and save always agree.
          #
          # Deliberately not using hashFiles(): it currently fails on hosted
          # runners with "Fail to hash files under directory ..." even for
          # trivial patterns (actions/runner#449, runner-images#13341).
          files_hash=$(
            find scripts/setup.sh scripts/debootstrap.sh configs dtbs -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -d' ' -f1
          )
          key="rootfs-${RELEASE}-${BOARD}-${HOST_NAME}-${KERNEL_VERSION}-${files_hash}"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "rootfs cache key: ${key}"

      - name: Restore cached rootfs (QEMU runners only)
        id: rootfs-cache
        if: inputs.runner == 'ubuntu-24.04'
        uses: actions/cache/restore@v4
        with:
          path: rootfs.tgz
          key: ${{ steps.rootfs-key.outputs.key }}

      - name: Create rootfs (debootstrap ${{ env.RELEASE }})
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          unmount_chroot() {
            for m in rootfs/proc rootfs/sys rootfs/dev/pts rootfs/dev rootfs/run; do
              sudo umount "$m" 2>/dev/null || true
            done
          }
          for i in 1 2 3; do
            if sudo env RELEASE="$RELEASE" HOST_NAME="$HOST_NAME" KERNEL_URL="$KERNEL_URL" sh -e scripts/debootstrap.sh; then
              exit 0
            fi
            echo "::warning::debootstrap failed (attempt $i/3), cleaning up and retrying"
            unmount_chroot
            sleep 15
          done
          exit 1

      - name: Unpack cached rootfs
        if: steps.rootfs-cache.outputs.cache-hit == 'true'
        run: |
          # build_gt.sh needs the chroot as a sysroot, so restore it as well.
          sudo mkdir -p rootfs
          sudo tar xpf rootfs.tgz -C rootfs
          sudo mount -t proc proc rootfs/proc
          sudo mount -o bind /dev rootfs/dev

      - name: Save rootfs to cache (QEMU runners only)
        if: inputs.runner == 'ubuntu-24.04' && steps.rootfs-cache.outputs.cache-hit != 'true'
        continue-on-error: true      # a concurrent run may have stored the same key
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.rootfs-key.outputs.key }}
          path: rootfs.tgz

      - name: Build gadget-tools (gt)
        run: sudo sh -e scripts/build_gt.sh

      - name: Create boot and rootfs images
        run: sudo sh -e scripts/build_images.sh

      - name: Verify outputs and generate checksums
        run: |
          set -e
          # files/ 由 sudo 构建脚本创建，属主是 root；改回 runner 用户，
          # 否则下面的 `> SHA256SUMS` 会报 Permission denied
          sudo chown -R "$(id -u):$(id -g)" files
          for f in gpt_both0.bin aboot.mbn hyp.mbn rpm.mbn sbl1.mbn tz.mbn boot.bin rootfs.bin; do
            test -s "files/$f" || { echo "::error::missing build output: files/$f"; exit 1; }
          done
          ( cd files && sha256sum gpt_both0.bin aboot.mbn hyp.mbn rpm.mbn sbl1.mbn tz.mbn boot.bin rootfs.bin > SHA256SUMS )
          {
            echo "## OpenStick Debian image"
            echo ""
            echo "- Debian release: $RELEASE"
            echo "- Board devicetree: $BOARD"
            echo "- Kernel: $KERNEL_BRANCH / $KERNEL_VERSION"
            echo "- Hostname: $HOST_NAME"
            echo "- Runner: ${RUNNER_ARCH}"
            echo "- rootfs: ${{ steps.rootfs-cache.outputs.cache-hit == 'true' && 'restored from cache' || 'built with debootstrap' }}"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in files/*; do
              [ -f "$f" ] || continue
              printf '| %s | %s |\n' "$(basename "$f")" "$(du -h --apparent-size "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat files/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openstick-debian-${{ env.RELEASE }}-${{ env.BOARD }}-${{ env.KERNEL_VERSION }}
          path: files/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
